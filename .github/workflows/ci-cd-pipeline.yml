name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (Front-End)
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install front-end dependencies
        run: npm install
        working-directory: Front-End

      - name: Run front-end tests
        run: npm test || echo "Nenhum teste encontrado"
        working-directory: Front-End

      - name: Build front-end project
        run: npm run build
        working-directory: Front-End

      # === BACKEND TESTS ===

      - name: Setup Node.js (Back-End)
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install back-end dependencies
        run: npm install
        working-directory: Back-End  # Ajuste esse diretório conforme sua estrutura

      - name: Run back-end tests
        run: npm test || echo "Nenhum teste encontrado"
        working-directory: Back-End

      - name: Build back-end project
        run: npm run build
        working-directory: Back-End  # Ajuste isso também se necessário

      # === RELEASE & DEPLOYMENT ===

      - name: Criar Release no GitHub
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          release_name: Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false

      - name: Criar Deployment no GitHub
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deploy = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              required_contexts: [],
              transient_environment: false,
              production_environment: true
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploy.data.id,
              state: 'success'
            });
